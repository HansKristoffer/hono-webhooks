# Lint and test every PR and every push to main.
name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      # Runs the built CLI and package under Node against a fixture app.
      - run: node dist/cli.js scripts/fixture-webhooks.ts test GET /health
      - run: >-
          node dist/cli.js scripts/fixture-webhooks.ts test POST /orders/1 -b '{"total":1}'
          -r ./scripts/fixture-preload.ts --sign shopify --secret-env FIXTURE_SECRET
      # Node can't load extensionless imports; the CLI must rerun under Bun.
      - run: node dist/cli.js scripts/fixture-bun-only.ts test GET /health
